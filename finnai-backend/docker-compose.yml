services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finnai
      POSTGRES_PASSWORD: finnai
      POSTGRES_DB: finnai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnai -d finnai"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://finnai:finnai@db:5432/finnai
      DATABASE_URL_SYNC: postgresql+psycopg://finnai:finnai@db:5432/finnai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:

